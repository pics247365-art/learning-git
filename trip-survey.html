<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>סקר חופשה זוגית · 2–5 בינואר</title>
<style>
  :root {
    --bg: #f7f2ea;
    --surface: #fffbf4;
    --surface2: #f0e9de;
    --border: #e3d9c9;
    --text: #2b2724;
    --muted: #7a6f61;
    --accent: #c95e35;
    --accent-soft: #f3d8cb;
    --good: #4a7c59;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", "Heebo", "Arial Hebrew", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    padding: 20px 18px 40px;
  }

  /* ---- header ---- */
  header { text-align: center; margin-bottom: 18px; }
  header .emoji { font-size: 40px; }
  header h1 { font-size: 22px; margin-top: 6px; }
  header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .dates-chip {
    display: inline-block;
    margin-top: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
  }

  /* ---- progress ---- */
  .progress {
    height: 6px;
    background: var(--surface2);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress > div {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 999px;
    transition: width .3s ease;
  }
  .step-label { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; }

  /* ---- question card ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 18px;
    box-shadow: 0 4px 14px rgba(43,39,36,.06);
  }
  .card h2 { font-size: 18px; margin-bottom: 4px; }
  .card .hint { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 13px 14px;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(.985); }
  .opt.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    font-weight: 700;
  }
  .opt .oemoji { font-size: 20px; }

  textarea {
    width: 100%;
    min-height: 90px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--surface2);
    padding: 12px;
    font: inherit;
    font-size: 15px;
    resize: vertical;
    color: var(--text);
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  /* ---- nav buttons ---- */
  .nav { display: flex; gap: 10px; margin-top: 18px; }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 14px;
    padding: 14px 18px;
    cursor: pointer;
  }
  .btn-next {
    flex: 1;
    background: var(--accent);
    color: #fff;
  }
  .btn-next:disabled { opacity: .4; cursor: default; }
  .btn-back {
    background: var(--surface2);
    color: var(--muted);
  }

  /* ---- summary ---- */
  .summary-item {
    padding: 12px 0;
    border-bottom: 1px dashed var(--border);
  }
  .summary-item:last-child { border-bottom: none; }
  .summary-item .q { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
  .summary-item .a { font-size: 15px; font-weight: 700; }
  .btn-wa {
    width: 100%;
    background: #25d366;
    color: #fff;
    margin-top: 16px;
  }
  .btn-copy {
    width: 100%;
    background: var(--surface2);
    color: var(--text);
    margin-top: 10px;
  }
  .btn-restart {
    width: 100%;
    background: none;
    color: var(--muted);
    margin-top: 10px;
    font-weight: 400;
    font-size: 13px;
    text-decoration: underline;
  }
  .copied { color: var(--good); text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; }

  .hidden { display: none !important; }

  /* ---- comparison table ---- */
  .compare {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .compare th, .compare td {
    padding: 8px 6px;
    text-align: center;
    border-bottom: 1px dashed var(--border);
  }
  .compare th { font-size: 14px; }
  .compare td:first-child, .compare th:first-child {
    text-align: right;
    color: var(--muted);
    font-size: 12px;
    width: 32%;
  }
  .compare tr:last-child td { border-bottom: none; }
  .compare .price { font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="emoji">✈️💑</div>
    <h1>סקר חופשה זוגית בחו"ל</h1>
    <p>3 לילות · עונים יחד ובודקים שאנחנו מסונכרנים</p>
    <div class="dates-chip">📅 2–5 בינואר</div>
  </header>

  <div class="step-label" id="stepLabel"></div>
  <div class="progress"><div id="bar"></div></div>

  <div class="card" id="card"></div>
</div>

<script>
const QUESTIONS = [
  {
    q: "איזה סגנון חופשה בא לכם?",
    hint: "בחרו תשובה אחת",
    multi: false,
    opts: [
      ["🏙️", "סיטי-ברייק — עיר אירופאית, קפה ורחובות"],
      ["❄️", "חורף אמיתי — שלג, אווירה וסירים חמים"],
      ["🏖️", "לברוח לחום — ים ושמש גם בינואר"],
      ["🛁", "רומנטי ורגוע — ספא, מלון טוב ולא לצאת ממנו"]
    ]
  },
  {
    q: "אילו יעדים מדברים אליכם?",
    hint: "אפשר לבחור כמה",
    multi: true,
    opts: [
      ["🇨🇿", "פראג"],
      ["🇭🇺", "בודפשט"],
      ["🇦🇹", "וינה"],
      ["🇮🇹", "רומא / מילאנו"],
      ["🇬🇷", "אתונה"],
      ["🇨🇾", "לרנקה / פאפוס"],
      ["🇦🇪", "דובאי / אבו דאבי"],
      ["🇪🇸", "ברצלונה / מדריד"]
    ]
  },
  {
    q: "מה התקציב לזוג?",
    hint: "כולל טיסות, מלון והוצאות — לכל החופשה",
    multi: false,
    opts: [
      ["💸", "עד 3,000 ₪ — חסכוני ושמח"],
      ["💰", "3,000–5,000 ₪ — מאוזן"],
      ["💎", "5,000–8,000 ₪ — מפנקים את עצמנו"],
      ["👑", "8,000 ₪ ומעלה — חופשה בלי חשבון"]
    ]
  },
  {
    q: "איפה נלון?",
    hint: "בחרו תשובה אחת",
    multi: false,
    opts: [
      ["🏩", "מלון בוטיק קטן ומפנק"],
      ["🏨", "מלון גדול 4–5 כוכבים עם ספא וארוחת בוקר"],
      ["🏠", "דירה / Airbnb — מרגישים מקומיים"],
      ["🛏️", "הכי זול שנקי — ממילא רק ישנים שם"]
    ]
  },
  {
    q: "מה חשוב בטיסות?",
    hint: "בחרו תשובה אחת",
    multi: false,
    opts: [
      ["😴", "רק שעות נוחות — בלי טיסות לילה"],
      ["🌙", "טיסת לילה זה בסדר אם חוסכים כסף"],
      ["🎯", "הכי זול שיש, נסתדר עם הכל"]
    ]
  },
  {
    q: "מה נעשה שם?",
    hint: "אפשר לבחור כמה",
    multi: true,
    opts: [
      ["🍝", "אוכל ומסעדות שוות"],
      ["🖼️", "מוזיאונים, תרבות ואטרקציות"],
      ["🛍️", "שופינג"],
      ["💆", "ספא ופינוקים"],
      ["🍸", "ברים וחיי לילה"],
      ["🥾", "טבע וטיולים מחוץ לעיר"],
      ["🎄", "שווקים ואווירת חורף"]
    ]
  },
  {
    q: "באיזה קצב?",
    hint: "בחרו תשובה אחת",
    multi: false,
    opts: [
      ["🏃", "עמוס — לנצל כל רגע, ישנים בבית"],
      ["🚶", "מאוזן — משהו אחד גדול ביום ומסביבו זורמים"],
      ["🦥", "רגוע — קמים מאוחר, בלי לו\"ז"]
    ]
  },
  {
    q: "משכירים רכב?",
    hint: "בחרו תשובה אחת",
    multi: false,
    opts: [
      ["🚗", "כן — חופש לצאת מהעיר"],
      ["🚇", "לא — תחבורה ציבורית והליכה"],
      ["🤷", "תלוי ביעד"]
    ]
  },
  {
    q: "ההכרעה הגדולה 🥊",
    hint: "לפי מחירי החבילות שבדקנו — לאן לבכם נוטה?",
    multi: false,
    compare: `
      <table class="compare">
        <tr><th></th><th>🇭🇺 בודפשט</th><th>🇦🇪 דובאי</th></tr>
        <tr><td>חבילה לזוג (3 לילות)</td><td class="price">‎₪2,500–2,900</td><td class="price">‎₪3,500–4,700</td></tr>
        <tr><td>רמת מלון בחבילה</td><td>4★ + א. בוקר</td><td>4–5★ + א. בוקר</td></tr>
        <tr><td>מזג אוויר בינואר</td><td>‎~0° ❄️ חורף אמיתי</td><td>‎~25° ☀️ קיץ מושלם</td></tr>
        <tr><td>משך טיסה</td><td>‎~4 שעות</td><td>‎~3.5 שעות</td></tr>
        <tr><td>הקטע שלה</td><td>מרחצאות חמים, גולאש, רובע היהודי</td><td>קניונים, חופים, ברים על גורדי שחקים</td></tr>
        <tr><td>עונה</td><td>שפל — מחירי רצפה</td><td>שיא — יקר אבל שווה</td></tr>
      </table>`,
    opts: [
      ["🇭🇺", "בודפשט — חורף רומנטי וזול"],
      ["🇦🇪", "דובאי — שמש ופינוק בשיא ינואר"],
      ["🤷", "עדיין מתלבטים — נחליט לפי הדיל"]
    ]
  },
  {
    q: "עוד משהו חשוב?",
    hint: "בקשות מיוחדות, חלומות, וטו... (לא חובה)",
    multi: false,
    free: true,
    opts: []
  }
];

let step = 0;
const answers = QUESTIONS.map(() => []);
let freeText = "";

const card = document.getElementById("card");
const bar = document.getElementById("bar");
const stepLabel = document.getElementById("stepLabel");

function render() {
  if (step >= QUESTIONS.length) return renderSummary();

  const item = QUESTIONS[step];
  bar.style.width = ((step) / QUESTIONS.length * 100) + "%";
  stepLabel.textContent = "שאלה " + (step + 1) + " מתוך " + QUESTIONS.length;

  let html = "<h2>" + item.q + "</h2><div class='hint'>" + item.hint + "</div>";

  if (item.compare) html += item.compare;

  if (item.free) {
    html += "<textarea id='free' placeholder='כתבו כאן...'>" + freeText + "</textarea>";
  } else {
    html += "<div class='options'>";
    item.opts.forEach((o, i) => {
      const sel = answers[step].includes(i) ? " selected" : "";
      html += "<div class='opt" + sel + "' data-i='" + i + "'><span class='oemoji'>" + o[0] + "</span><span>" + o[1] + "</span></div>";
    });
    html += "</div>";
  }

  html += "<div class='nav'>";
  if (step > 0) html += "<button class='btn-back' id='back'>חזרה</button>";
  const last = step === QUESTIONS.length - 1;
  html += "<button class='btn-next' id='next'" + (canProceed() ? "" : " disabled") + ">" + (last ? "סיימנו! 🎉" : "הבא") + "</button>";
  html += "</div>";

  card.innerHTML = html;

  card.querySelectorAll(".opt").forEach(el => {
    el.addEventListener("click", () => {
      const i = +el.dataset.i;
      if (item.multi) {
        const idx = answers[step].indexOf(i);
        if (idx >= 0) answers[step].splice(idx, 1);
        else answers[step].push(i);
      } else {
        answers[step] = [i];
      }
      render();
    });
  });

  const free = document.getElementById("free");
  if (free) free.addEventListener("input", () => { freeText = free.value; });

  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => { step--; render(); });

  document.getElementById("next").addEventListener("click", () => {
    if (!canProceed()) return;
    step++;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

function canProceed() {
  const item = QUESTIONS[step];
  if (item.free) return true;
  return answers[step].length > 0;
}

function answerText(i) {
  const item = QUESTIONS[i];
  if (item.free) return freeText.trim() || "—";
  return answers[i].sort((a, b) => a - b).map(idx => item.opts[idx][1]).join(", ") || "—";
}

function buildShareText() {
  let t = "✈️💑 סקר חופשה זוגית — 3 לילות, 2–5 בינואר\n\n";
  QUESTIONS.forEach((item, i) => {
    t += "• " + item.q + "\n  " + answerText(i) + "\n";
  });
  return t;
}

function renderSummary() {
  bar.style.width = "100%";
  stepLabel.textContent = "סיכום";

  let html = "<h2>הסיכום שלכם 🎉</h2><div class='hint'>שלחו לבן/בת הזוג והשוו תשובות</div>";
  QUESTIONS.forEach((item, i) => {
    html += "<div class='summary-item'><div class='q'>" + item.q + "</div><div class='a'>" + answerText(i) + "</div></div>";
  });
  html += "<button class='btn-wa' id='wa'>📲 לשלוח בוואטסאפ</button>";
  html += "<button class='btn-copy' id='copy'>📋 להעתיק את הסיכום</button>";
  html += "<div class='copied' id='copiedMsg'></div>";
  html += "<button class='btn-restart' id='restart'>למלא מחדש</button>";

  card.innerHTML = html;

  document.getElementById("wa").addEventListener("click", () => {
    window.open("https://wa.me/?text=" + encodeURIComponent(buildShareText()), "_blank");
  });

  document.getElementById("copy").addEventListener("click", () => {
    navigator.clipboard.writeText(buildShareText()).then(() => {
      document.getElementById("copiedMsg").textContent = "הועתק! ✓";
      setTimeout(() => document.getElementById("copiedMsg").textContent = "", 2500);
    });
  });

  document.getElementById("restart").addEventListener("click", () => {
    step = 0;
    answers.forEach(a => a.length = 0);
    freeText = "";
    render();
  });
}

render();
</script>
</body>
</html>
